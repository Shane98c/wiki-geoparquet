name: Monthly Build

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of each month, 6am UTC
  workflow_dispatch: # manual trigger

env:
  TIPPECANOE_REF: b3c548c4  # pinned: includes --drop-by-attribute-as-needed

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 5.5 hours
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache tippecanoe binary
        id: cache-tippecanoe
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe
          key: tippecanoe-${{ runner.os }}-${{ runner.arch }}-${{ env.TIPPECANOE_REF }}

      - name: Install DuckDB CLI
        run: |
          curl -fsSL https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o duckdb.zip
          unzip -o duckdb.zip -d ~/bin
          echo "$HOME/bin" >> $GITHUB_PATH
          ~/bin/duckdb -c "INSTALL spatial;"

      - name: Build tippecanoe from source
        if: steps.cache-tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev zlib1g-dev
          git clone https://github.com/felt/tippecanoe.git /tmp/tippecanoe-src
          cd /tmp/tippecanoe-src
          git checkout ${{ env.TIPPECANOE_REF }}
          make -j$(nproc)
          mkdir -p ~/tippecanoe
          cp tippecanoe ~/tippecanoe/

      - name: Download Wikipedia dumps
        run: make download
        timeout-minutes: 120

      - name: Extract GeoParquet
        run: make extract
        timeout-minutes: 150

      - name: Build PMTiles
        run: make tiles TIPPECANOE=~/tippecanoe/tippecanoe

      - name: Validate
        run: make validate

      - name: Upload to R2
        run: |
          npm install -g wrangler
          wrangler r2 object put wiki-geoparquet/v1/wikipedia_geotagged.parquet \
            --file data/wikipedia_geotagged.parquet \
            --content-type application/vnd.apache.parquet --remote
          wrangler r2 object put wiki-geoparquet/v1/wikipedia_geotagged.pmtiles \
            --file data/wikipedia_geotagged.pmtiles \
            --content-type application/vnd.pmtiles --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Create release
        run: |
          TAG=$(date +v%Y-%m-%d)
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Wikipedia Geo $TAG" \
              --notes "Monthly rebuild from Wikipedia dumps."
          gh release upload "$TAG" \
            data/wikipedia_geotagged.parquet \
            data/wikipedia_geotagged.pmtiles \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
